# Minimal baseline for run_vlm_train.sh: every field the script overrides
# exists here so typed CLI overrides resolve. Runtime values are replaced
# via env vars at launch time.
model:
  _target_: hyper_parallel.models.HyperAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /data1/models/Qwen3.8-27B
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_iters: 10
  train_samples: null
  global_batch_size: 16
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 16
  replicate_params: []
  mix_precision:
    param_dtype: null
    reduce_dtype: float32
    output_dtype: null
    cast_forward_inputs: true
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match: "*.linear_attn"
    module_type: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe.Qwen3_5MoeGatedDeltaNet
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.TritonGDN

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  data_transform:
    _target_: hyper_parallel.data.vlm.build_data_transform.build_vlm_data_transform
    # Document VLM defaults: doc pages need ~1-4M pixels and long targets
    # (HTML/markdown) need room beyond the vision tokens.
    max_seq_len: 8192
    min_pixels: 65536
    max_pixels: 4194304
  _target_: hyper_parallel.data.vlm.dataset.build_vlm_dataset
  data_config:
    manifest: null
    sources: null
    source_type: parquet
    schema_adapter: auto
    lazy_parquet: true
    recursive: false
    eager_filter: false
  data_path: /data1/f00538480/dataset/HW_Chinese/hw_chinese_ocr_train_tiny.parquet

dataloader:
  _target_: hyper_parallel.data.batching.build_dataloader.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.vlm.build_vlm_collator
  get_batch:
    _target_: hyper_parallel.data.vlm.build_vlm_get_batch
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: false
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 10
    min_lr: 1.0e-6

checkpoint:
  save_ckpt: true
  save_hf_weights: true
  checkpoint_dir: ./outputs/qwen3_8/checkpoints_oneshot
  save_steps: 50
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  save_extra_state_per_rank: false
  restore_from: null
  restore_optimizer: true
  restore_train_state: true

debug:
  check_nan_inf: false
  check_dataset: null

profiling:
  enabled: false
  start_step: 99
  end_step: 100
  trace_dir: ./outputs/qwen3_8/profiling_oneshot
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0
